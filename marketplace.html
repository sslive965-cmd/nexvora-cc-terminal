<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NEXVORA CC TERMINAL — MARKETPLACE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(circle at top, rgba(0, 255, 120, 0.08), transparent 35%),
        #020403;
      color: #d8ffe8;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          rgba(0, 255, 120, 0.025) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0, 255, 120, 0.025) 1px,
          transparent 1px
        );
      background-size: 40px 40px;
      z-index: -1;
    }

    .container {
      width: min(1200px, 94%);
      margin: auto;
    }

    header {
      padding: 22px 0 12px;
      border-bottom: 1px solid rgba(0, 255, 120, 0.12);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      color: #00ff73;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(0, 255, 115, 0.65);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #9cffbd;
      font-size: 12px;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #00ff73;
      box-shadow: 0 0 12px #00ff73;
    }

    .hero {
      padding: 35px 0 22px;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(28px, 6vw, 58px);
      color: #00ff73;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow:
        0 0 10px rgba(0, 255, 115, 0.6),
        0 0 30px rgba(0, 255, 115, 0.25);
    }

    .hero p {
      margin-top: 10px;
      color: #80a991;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 20px 0 30px;
    }

    .filter {
      border: 1px solid rgba(0, 255, 115, 0.35);
      background: rgba(0, 255, 115, 0.04);
      color: #8dffb7;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      transition: 0.2s ease;
    }

    .filter:hover {
      border-color: #00ff73;
      box-shadow: 0 0 15px rgba(0, 255, 115, 0.18);
      transform: translateY(-1px);
    }

    .filter.active {
      background: #00ff73;
      color: #001b0b;
      border-color: #00ff73;
      box-shadow: 0 0 20px rgba(0, 255, 115, 0.35);
    }

    .message {
      width: min(650px, 100%);
      margin: 0 auto 25px;
      padding: 14px 16px;
      border: 1px solid rgba(0, 255, 115, 0.18);
      background: rgba(0, 255, 115, 0.035);
      border-radius: 10px;
      color: #8affb3;
      text-align: center;
      font-size: 13px;
      display: none;
    }

    .message.error {
      color: #ff8b8b;
      border-color: rgba(255, 60, 60, 0.25);
      background: rgba(255, 60, 60, 0.05);
    }

    .message.show {
      display: block;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
      padding-bottom: 40px;
    }

    .product-card {
      border: 1px solid rgba(0, 255, 115, 0.18);
      background:
        linear-gradient(
          145deg,
          rgba(0, 255, 115, 0.055),
          rgba(0, 0, 0, 0.55)
        );
      border-radius: 14px;
      padding: 14px;
      overflow: hidden;
      transition: 0.25s ease;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.35);
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 255, 115, 0.5);
      box-shadow:
        0 0 30px rgba(0, 255, 115, 0.1),
        inset 0 0 20px rgba(0, 255, 115, 0.025);
    }

    .product-image {
      height: 205px;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background:
        radial-gradient(
          circle at center,
          rgba(0, 255, 115, 0.08),
          rgba(0, 0, 0, 0.7)
        );
      border: 1px solid rgba(0, 255, 115, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .placeholder-card {
      width: 82%;
      height: 72%;
      border-radius: 13px;
      padding: 18px;
      background:
        linear-gradient(
          135deg,
          #101612,
          #020403
        );
      border: 1px solid rgba(0, 255, 115, 0.25);
      box-shadow: 0 0 20px rgba(0, 255, 115, 0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .placeholder-brand {
      color: #00ff73;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 2px;
    }

    .placeholder-number {
      color: #c5ffd9;
      font-family: monospace;
      font-size: 15px;
      letter-spacing: 2px;
    }

    .placeholder-bottom {
      display: flex;
      justify-content: space-between;
      color: #71917d;
      font-size: 8px;
      text-transform: uppercase;
    }

    .product-info {
      padding: 15px 2px 3px;
    }

    .product-brand {
      color: #00ff73;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .product-name {
      color: #eafff1;
      margin-top: 6px;
      font-size: 17px;
      font-weight: 800;
    }

    .product-description {
      margin-top: 7px;
      color: #769280;
      font-size: 11px;
      line-height: 1.5;
      min-height: 32px;
    }

    .product-meta {
      margin-top: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .network {
      color: #83ffa9;
      border: 1px solid rgba(0, 255, 115, 0.2);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 9px;
      font-weight: 900;
    }

    .price {
      color: #00ff73;
      font-size: 20px;
      font-weight: 900;
    }

    .buy-btn {
      width: 100%;
      margin-top: 14px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #00ff73;
      color: #001b0b;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .buy-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 20px rgba(0, 255, 115, 0.35);
    }

    .buy-btn:active {
      transform: scale(0.98);
    }

    .empty {
      grid-column: 1 / -1;
      padding: 50px 20px;
      text-align: center;
      border: 1px dashed rgba(0, 255, 115, 0.2);
      border-radius: 12px;
      color: #63806d;
      font-size: 13px;
    }

    .footer {
      border-top: 1px solid rgba(0, 255, 115, 0.1);
      padding: 20px 0 30px;
      text-align: center;
      color: #45614d;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .footer-links {
      margin-top: 10px;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: #73a181;
      text-decoration: none;
    }

    .footer-links a:hover {
      color: #00ff73;
    }

    @media (max-width: 900px) {
      .products-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .container {
        width: 92%;
      }

      .topbar {
        align-items: flex-start;
      }

      .brand {
        font-size: 17px;
      }

      .status {
        font-size: 10px;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .product-image {
        height: 220px;
      }

      .filter {
        padding: 10px 13px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <div class="topbar">

        <div class="brand">
          NEXVORA CC TERMINAL
        </div>

        <div class="status">
          <span class="status-dot"></span>
          TERMINAL ONLINE
        </div>

      </div>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <h1>MARKETPLACE</h1>
      <p>SELECT YOUR NETWORK AND CONTINUE</p>
    </section>

    <!-- ONLY THESE 4 CATEGORIES -->
    <div class="filters">

      <button
        class="filter active"
        data-category="rupay">
        RUPAY
      </button>

      <button
        class="filter"
        data-category="visa">
        VISA
      </button>

      <button
        class="filter"
        data-category="mastercard">
        MASTERCARD
      </button>

      <button
        class="filter"
        data-category="amex">
        AMEX
      </button>

    </div>

    <div
      id="message"
      class="message">
    </div>

    <section
      id="productsGrid"
      class="products-grid">

      <div class="empty">
        LOADING PRODUCT NODE...
      </div>

    </section>

  </main>

  <footer class="footer">

    <div class="container">

      NEXVORA CC TERMINAL

      <div class="footer-links">

        <a href="track.html">
          TRACK ORDER
        </a>

        <a href="support.html">
          SUPPORT
        </a>

      </div>

    </div>

  </footer>

  <script>

    /* =========================
       SUPABASE CONFIG
    ========================= */

    const SUPABASE_URL =
      "https://ccxuowtyrscobhzqener.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_h7wZAcc0HsCq8DLUdDa4dw_3hBthOLY";


    /* =========================
       STATE
    ========================= */

    let allProducts = [];

    let activeCategory = "rupay";


    /* =========================
       ELEMENTS
    ========================= */

    const productsGrid =
      document.getElementById("productsGrid");

    const messageBox =
      document.getElementById("message");


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(text, isError = false) {

      messageBox.textContent = text;

      messageBox.className =
        "message show" +
        (isError ? " error" : "");

    }


    function hideMessage() {

      messageBox.className = "message";

      messageBox.textContent = "";

    }


    /* =========================
       SAFE TEXT
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================
       CATEGORY
    ========================= */

    function getProductCategory(product) {

      return String(
        product.network ||
        product.category ||
        product.type ||
        product.brand ||
        ""
      )
        .trim()
        .toLowerCase()
        .replace(/[\s_-]+/g, "");

    }


    /* =========================
       PRICE
    ========================= */

    function formatPrice(value) {

      const amount =
        Number(value);

      if (!Number.isFinite(amount)) {
        return "₹0";
      }

      return "₹" + amount.toFixed(2);

    }


    /* =========================
       PRODUCT IMAGE
    ========================= */

    function createProductVisual(product) {

      const imageUrl =
        String(product.image_url || "").trim();

      if (imageUrl) {

        return `
          <div class="product-image">

            <img
              src="${escapeHtml(imageUrl)}"
              alt="${escapeHtml(product.name || "Product")}"
              loading="lazy"
              onerror="this.parentElement.innerHTML = createPlaceholderHtml()"
            >

          </div>
        `;

      }

      return `
        <div class="product-image">

          <div class="placeholder-card">

            <div class="placeholder-brand">
              NEXVORA
            </div>

            <div class="placeholder-number">
              •••• •••• •••• 0000
            </div>

            <div class="placeholder-bottom">

              <span>
                DEMO
              </span>

              <span>
                TERMINAL
              </span>

            </div>

          </div>

        </div>
      `;

    }


    function createPlaceholderHtml() {

      return `
        <div class="placeholder-card">

          <div class="placeholder-brand">
            NEXVORA
          </div>

          <div class="placeholder-number">
            •••• •••• •••• 0000
          </div>

          <div class="placeholder-bottom">

            <span>
              DEMO
            </span>

            <span>
              TERMINAL
            </span>

          </div>

        </div>
      `;

    }


    /* =========================
       BUY NOW
    ========================= */

    function buyNow(product) {

      if (!product || !product.id) {

        showMessage(
          "PRODUCT DATA INVALID",
          true
        );

        return;

      }

      const params =
        new URLSearchParams();

      params.set(
        "product_id",
        product.id
      );

      params.set(
        "product_name",
        product.name || ""
      );

      params.set(
        "category",
        product.network ||
        product.category ||
        product.type ||
        product.brand ||
        ""
      );

      params.set(
        "amount",
        product.price ?? 0
      );

      window.location.href =
        "payment.html?" +
        params.toString();

    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts() {

      hideMessage();

      const filtered =
        allProducts.filter(
          product =>
            getProductCategory(product) ===
            activeCategory
        );


      if (!filtered.length) {

        productsGrid.innerHTML = `
          <div class="empty">

            NO ${escapeHtml(
              activeCategory.toUpperCase()
            )} PRODUCTS AVAILABLE

          </div>
        `;

        return;

      }


      productsGrid.innerHTML =
        filtered.map(product => {

          const category =
            String(
              product.network ||
              product.category ||
              product.type ||
              product.brand ||
              activeCategory
            ).toUpperCase();


          const name =
            product.name ||
            "NEXVORA PRODUCT";


          const brand =
            product.brand ||
            category;


          const description =
            product.description ||
            "Verified marketplace product.";


          return `

            <article class="product-card">

              ${createProductVisual(product)}

              <div class="product-info">

                <div class="product-brand">
                  ${escapeHtml(brand)}
                </div>

                <div class="product-name">
                  ${escapeHtml(name)}
                </div>

                <div class="product-description">
                  ${escapeHtml(description)}
                </div>

                <div class="product-meta">

                  <div class="network">
                    ${escapeHtml(category)}
                  </div>

                  <div class="price">
                    ${formatPrice(product.price)}
                  </div>

                </div>

                <button
                  class="buy-btn"
                  type="button"
                  data-product-id="${escapeHtml(product.id)}">

                  BUY NOW

                </button>

              </div>

            </article>

          `;

        }).join("");


      document
        .querySelectorAll(".buy-btn")
        .forEach(button => {

          button.addEventListener(
            "click",
            () => {

              const productId =
                button.dataset.productId;

              const product =
                allProducts.find(
                  item =>
                    String(item.id) ===
                    String(productId)
                );

              buyNow(product);

            }
          );

        });

    }


    /* =========================
       LOAD PRODUCTS
    ========================= */

    async function loadProducts() {

      productsGrid.innerHTML = `
        <div class="empty">
          CONNECTING TO PRODUCT NODE...
        </div>
      `;


      try {

        const response =
          await fetch(
            `${SUPABASE_URL}/rest/v1/products?select=*&available=eq.true&order=sort_order.asc,created_at.desc`,
            {
              method: "GET",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_KEY}`
              },

              cache: "no-store"
            }
          );


        if (!response.ok) {

          let errorText =
            "";

          try {
            errorText =
              await response.text();
          } catch (_) {}

          console.error(
            "PRODUCT NODE ERROR:",
            response.status,
            errorText
          );

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const data =
          await response.json();


        if (!Array.isArray(data)) {

          throw new Error(
            "Invalid product response"
          );

        }


        allProducts =
          data.filter(
            product =>
              product &&
              product.id
          );


        renderProducts();

      }

      catch (error) {

        console.error(
          "PRODUCT LOAD FAILED:",
          error
        );

        productsGrid.innerHTML = `
          <div class="empty">

            PRODUCT NODE CONNECTION FAILED

            <br><br>

            <span style="font-size:11px;">
              Please refresh the terminal.
            </span>

          </div>
        `;

        showMessage(
          "Unable to connect to product node.",
          true
        );

      }

    }


    /* =========================
       CATEGORY EVENTS
    ========================= */

    document
      .querySelectorAll(".filter")
      .forEach(button => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(".filter")
              .forEach(btn =>
                btn.classList.remove("active")
              );


            button.classList.add(
              "active"
            );


            activeCategory =
              String(
                button.dataset.category ||
                "rupay"
              )
              .toLowerCase();


            renderProducts();

          }
        );

      });


    /* =========================
       START
    ========================= */

    loadProducts();

  </script>

</body>
</html>
