<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXVORA X — Payment Review</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#03060b;color:#eaf8ff;font:14px Arial,sans-serif}button,input{font:inherit}button{border:0;border-radius:9px;padding:12px 14px;font-weight:800;cursor:pointer}button:disabled{opacity:.55}input{width:100%;background:#030a10;color:#eaf8ff;border:1px solid #17445b;border-radius:9px;padding:12px}label{display:block;color:#7fa9bf;font-size:11px;margin:14px 0 6px}.hidden{display:none!important}.shell{max-width:950px;margin:auto;padding:16px}.panel,.item{background:#07131b;border:1px solid #17445b;border-radius:15px;padding:16px;margin-bottom:14px}.brand,.item-title{color:#19bfff;font-weight:900}.brand{font-size:20px;letter-spacing:1px}.muted,small,.note{color:#7fa9bf;font-size:11px;line-height:1.6}.primary{width:100%;margin-top:16px;background:#19bfff;color:#00121b}.dark{background:#07131b;color:#19bfff;border:1px solid #19bfff}.danger{background:#260909;color:#ff7777;border:1px solid #632020}.top,.actions{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.item-title{font-size:15px;margin-bottom:8px;overflow-wrap:anywhere}.item small{display:block;margin-top:6px;overflow-wrap:anywhere}.actions{justify-content:flex-start;margin-top:12px}.actions button,.actions a{font-size:11px;text-decoration:none}.msg{display:none;margin-top:12px;padding:11px;border-radius:8px;font-size:12px;overflow-wrap:anywhere}.msg.error{display:block;color:#ff7777;background:#180606;border:1px solid #632020}.msg.success{display:block;color:#19bfff;background:#071b27;border:1px solid #17445b}.badge{display:inline-block;padding:4px 7px;border-radius:6px;font-size:10px;font-weight:900;border:1px solid #17445b}.green{color:#19bfff}.red{color:#ff7777}.loading{padding:12px 0;color:#7fa9bf}@media(max-width:520px){.shell{padding:10px}.panel,.item{padding:13px}}
</style>

<style id="nexvora-electric-blue-theme">
:root{--blue:#19bfff;--blue-dark:#087db8;--black:#03060b;--panel:rgba(5,13,24,.92);--border:rgba(25,191,255,.38);--text:#eaf8ff;--muted:#7fa9bf}
html,body{background-color:#03060b!important;color:#eaf8ff}
button,.button,.btn,[role="button"]{accent-color:#19bfff}
input,select,textarea{border-color:rgba(25,191,255,.4)!important}
:focus-visible{outline:2px solid #19bfff;outline-offset:2px}
</style>
</head>
<body><div class="shell">
<div class="panel"><div class="brand">NEXVORA X</div><div class="muted">SECURE ADMIN · PAYMENT REVIEW</div>
<div id="loginBox"><label>ADMIN EMAIL</label><input id="email" type="email" autocomplete="username" placeholder="Admin email"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn" class="primary">LOGIN</button></div>
<div id="appBox" class="hidden"><div class="top" style="margin-top:14px"><div><strong id="adminEmail"></strong><div class="note">Review customer UTRs and payment screenshots.</div></div><div class="actions"><button id="refreshBtn" class="dark">REFRESH</button><button id="logoutBtn" class="danger">LOGOUT</button></div></div></div><div id="message" class="msg"></div></div>
<div id="reviewPanel" class="panel hidden"><div class="top"><h3 style="margin:0;color:#19bfff">PAYMENT PROOFS</h3><span class="muted">Latest 100 submissions</span></div><div id="list"><div class="loading">Loading payment proofs…</div></div></div>
<p class="note">Screenshot links are temporary signed URLs. Keep the payment-screenshots bucket private.</p></div>
<script>
const SUPABASE_URL="https://ccxuowtyrscobhzqener.supabase.co";
const SUPABASE_KEY="sb_publishable_h7wZAcc0HsCq8DLUdDa4dw_3hBthOLY";
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
function msg(text,type="error"){const el=$("message");el.textContent=text;el.className="msg "+type;}
async function verifyAdmin(){const r=await db.rpc("is_admin_user");if(r.error)throw new Error("Admin verification failed: "+r.error.message);if(r.data!==true)throw new Error("This account is not authorized as an administrator.");}
function showApp(user){$("loginBox").classList.add("hidden");$("appBox").classList.remove("hidden");$("reviewPanel").classList.remove("hidden");$("adminEmail").textContent=user?.email||"Admin";loadProofs();}
async function login(){const email=$("email").value.trim().toLowerCase(),password=$("password").value;if(!email||!password){msg("Enter admin email and password.");return;}$("loginBtn").disabled=true;$("loginBtn").textContent="CHECKING…";try{const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;await verifyAdmin();$("message").className="msg";showApp(r.data.user);}catch(e){await db.auth.signOut();msg(e.message||"Login failed.");}finally{$("loginBtn").disabled=false;$("loginBtn").textContent="LOGIN";}}
function storagePath(value){let p=String(value||"").trim();const marker="/payment-screenshots/";if(p.includes(marker))p=p.split(marker).pop().split("?")[0];return p.replace(/^payment-screenshots\//,"").replace(/^\/+/,"");}
async function loadProofs(){const box=$("list");box.innerHTML='<div class="loading">Loading payment proofs…</div>';const r=await db.from("orders").select("*").not("utr","is",null).not("payment_screenshot_url","is",null).order("created_at",{ascending:false}).limit(100);if(r.error){box.innerHTML='<div class="item">Could not load orders: '+esc(r.error.message)+'</div>';return;}const rows=r.data||[];if(!rows.length){box.innerHTML='<div class="item muted">No payment submissions found. Orders appear here when both UTR and screenshot path are saved.</div>';return;}box.innerHTML='<div class="loading">Preparing secure screenshot links…</div>';const cards=await Promise.all(rows.map(async o=>{let link="",linkError="";const path=storagePath(o.payment_screenshot_url);if(path){const sr=await db.storage.from("payment-screenshots").createSignedUrl(path,300);if(sr.error)linkError=sr.error.message;else link=sr.data?.signedUrl||"";}const status=String(o.status||"pending").toLowerCase(),cls=status==="verified"?"green":status==="declined"?"red":"";const view=link?'<a class="dark" href="'+esc(link)+'" target="_blank" rel="noopener noreferrer">VIEW SCREENSHOT · 5 MIN LINK</a>':'<small>Screenshot unavailable: '+esc(linkError||"No signed URL returned")+'</small>';return '<div class="item"><div class="item-title">Order: '+esc(o.order_id||o.id||"—")+'</div><small>Product: '+esc(o.product_name||"—")+'</small><small>Amount: ₹'+esc(o.amount??"0")+'</small><small>Customer email: '+esc(o.customer_email||"—")+'</small><small>UTR / Transaction ID: <strong>'+esc(o.utr||"—")+'</strong></small><small>Status: <span class="badge '+cls+'">'+esc(o.status||"pending")+'</span></small><small>Submitted: '+esc(o.created_at||"—")+'</small><div class="actions">'+view+'</div><div class="actions"><button class="dark" data-review-id="'+esc(o.id)+'" data-status="verified">VERIFY PAYMENT</button><button class="danger" data-review-id="'+esc(o.id)+'" data-status="declined">DECLINE PAYMENT</button></div></div>';}));box.innerHTML=cards.join("");}
async function updateStatus(id,status){if(!confirm(status==="verified"?"Confirm payment was checked and should be marked VERIFIED?":"Decline this payment submission?"))return;const r=await db.from("orders").update({status,updated_at:new Date().toISOString()}).eq("id",id);if(r.error){msg("Status update failed: "+r.error.message);return;}msg("Order status updated to "+status+".","success");await loadProofs();}
$("loginBtn").addEventListener("click",login);$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login();});$("refreshBtn").addEventListener("click",loadProofs);$("logoutBtn").addEventListener("click",async()=>{await db.auth.signOut();location.reload();});$("list").addEventListener("click",e=>{const b=e.target.closest("[data-review-id]");if(b)updateStatus(b.dataset.reviewId,b.dataset.status);});
(async()=>{try{const r=await db.auth.getSession();if(r.data?.session){await verifyAdmin();showApp(r.data.session.user);}}catch(e){await db.auth.signOut();msg("Saved session was not authorized. Please log in again.");}})();
</script></body></html>
